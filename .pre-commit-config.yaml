---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 581213484f4262600d17c71e272176d4eb6724a5  # frozen: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 48dbc906f2ce7c0772cc8f106318831dee575de6  # frozen: 3.3.16
    hooks:
      - id: checkov
        args: [--config-file, ./configs/checkov.yml]

  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - ./configs/.secrets.baseline
        exclude: |
          (?x)^(
            \.pre-commit-config\.yaml|
            configs/\.secrets\.baseline
          )$

  - repo: https://github.com/terraform-docs/terraform-docs
    rev: "4025989e4fd50bb33592d7a3a4cfb3b46de9367a"  # frozen: v0.24.0
    hooks:
      - id: terraform-docs-go
        name: terraform-docs (module)
        language_version: "1.25.0"
        args:
          - "markdown"
          - "table"
          - "--output-file"
          - "README.md"
          - "--output-mode"
          - "inject"
          - "."
      - id: terraform-docs-go
        name: terraform-docs (examples/minimal)
        language_version: "1.25.0"
        args:
          - "markdown"
          - "table"
          - "--output-file"
          - "README.md"
          - "--output-mode"
          - "inject"
          - "examples/minimal"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --config=./configs/ruff.toml]
      - id: ruff-format
        args: [--config=./configs/ruff.toml]
