name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625b9a4a6e7af1cc3b87559f34ee99a # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
